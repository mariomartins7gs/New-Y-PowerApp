App:
  Properties:
    OnStart: |
      =Set(
          TemaNewY,
          {
              ScuroPrimario: ColorValue("#0D1B2A"),
              BluPrimario: ColorValue("#1B3A5C"),
              AccentiDorati: ColorValue("#C9A227"),
              LuceSuperficie: ColorValue("#F5F0EB"),
              TestoPrimario: ColorValue("#0D1B2A"),
              TestoSecondario: ColorValue("#5A6B7D"),
              Successo: ColorValue("#2E7D32"),
              Avvertimento: ColorValue("#E65100"),
              Errore: ColorValue("#C62828")
          }
      );
      // Salva i tre ruoli ammessi in una variabile globale sotto forma di tabella
      Set(
          varRuoliAmmessi,
          [
              "Agente",
              "Office",
              "Manager"
          ]
      );
      Set(varRuoloUtente, "");
      Set(varIsManager, false);
      Set(lblErroreVisible, false);
      Set(varFiltroSoloDisponibili, false);

      Set(varNotificheAttive, false)
    StartScreen: ='LOGIN'
    Theme: =PowerAppsTheme
