Screens:
  LOGIN:
    Properties:
      Fill: |+
        =RGBA(30,58,110,1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Image8:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Parent.Height
            Image: ='ChatGPT Image 13 lug 2026, 16_20_30'
            ImagePosition: =ImagePosition.Fill
            Width: =Parent.Width
      - Container1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - cntLoginCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderThickness: =5
                  Fill: =TemaNewY.BluPrimario
                  FillPortions: =0
                  Height: |+
                    =500
                  LayoutAlignItems: |+
                    =LayoutAlignItems.Center
                  LayoutDirection: |+
                    =LayoutDirection.Vertical
                  LayoutGap: |+
                    =20
                  LayoutJustifyContent: |+
                    =LayoutJustifyContent.Center
                  LayoutMaxWidth: =600
                  PaddingBottom: |+
                    =30
                  PaddingLeft: |+
                    =40
                  PaddingRight: |+
                    =40
                  PaddingTop: |+
                    =30
                  RadiusBottomLeft: |+
                    =16
                  RadiusBottomRight: |+
                    =16
                  RadiusTopLeft: |+
                    =16
                  RadiusTopRight: |+
                    =16
                  Width: |+
                    =400
                Children:
                  - Image1:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =180
                        Image: ='new-y_logo_sign'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =200
                  - txtEmail:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: |+
                          =""
                        Font: =Font.'Open Sans'
                        HintText: ="Inserisci la tua email"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: =Filter(UserRoles, Lower(Email) = Lower(txtEmail.Text))
                        Width: |+
                          =320
                  - lblErrore:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: |+
                          ="email non trovata, contatta il tuo responsabile"
                        Visible: =false
      - btnLogin:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =TemaNewY.LuceSuperficie
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =TemaNewY.AccentiDorati
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(
                  varUtenteCorrente,
                  LookUp(UserRoles, Email = txtEmail.Text)
              );
              If(
                  IsBlank(varUtenteCorrente),
                  Notify("Email non trovata. Verifica e riprova.", NotificationType.Error),
                  Set(
                      varRuoloUtente,
                      Switch(
                          Lower(Trim(varUtenteCorrente.Role)),
                          "agent", "Agent",
                          "agente", "Agent",
                          "manager", "Manager",
                          "office", "Office",
                          varUtenteCorrente.Role
                      )
                  );
                  Set(varAccessoEffettuato, true);
                  Navigate(scrLoading)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: |-
              ="ACCEDI
              "
            X: =603
            Y: =527
