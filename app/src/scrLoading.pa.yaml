Screens:
  scrLoading:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Image4:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Parent.Height
            Image: ='ChatGPT Image 13 lug 2026, 16_20_31'
            ImagePosition: =ImagePosition.Fill
            Width: =Parent.Width
      - cntLoginCard_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =Color.Black
            BorderThickness: |+
              =5
            Fill: =TemaNewY.BluPrimario
            Height: =682
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =30
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Width: =Parent.Width/3
            X: =(Parent.Width - Self.Width) / 2
            Y: =44
          Children:
            - Image5:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Image: =User().Image
                  X: =Parent.X/2
            - Label2_1:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =TemaNewY.LuceSuperficie
                  Font: =Font.'Open Sans'
                  Size: =25
                  Text: |-
                    ="Benvenuto" & Char(10) & 
                    Left(
                        varUtenteCorrente.Email,
                        Find("@", varUtenteCorrente.Email) - 1
                    ) & Char(10) & Switch(
                        varRuoloUtente,
                        "Manager", "Manager",
                        "Agent", "Agente",
                        "Office", "Office",
                        varRuoloUtente
                    )
                  Width: =Parent.Width
                  Y: =Parent.Y
            - timerSpinner:
                Control: Timer@2.1.0
                Properties:
                  AutoStart: =true
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
                  DisabledColor: =ColorFade(Self.Fill, 90%)
                  DisabledFill: =ColorFade(Self.Fill, 70%)
                  Duration: =100
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnTimerEnd: =Set(varRotazione, Mod(varRotazione + 10, 360))
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Repeat: =true
                  Visible: =false
            - Timer2:
                Control: Timer@2.1.0
                Properties:
                  AutoPause: =false
                  AutoStart: =true
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
                  DisabledColor: =ColorFade(Self.Fill, 90%)
                  DisabledFill: =ColorFade(Self.Fill, 70%)
                  Duration: =1300
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnTimerEnd: |-
                    =Switch(
                        varUtenteCorrente.Role,
                        "Manager", Navigate('HP-MANAGER', ScreenTransition.Fade),
                        "Office", Navigate('HP-MANAGER', ScreenTransition.Fade),
                        "Agente", Navigate('HP-MANAGER', ScreenTransition.Fade),

                        // Default se il ruolo non è configurato
                        Notify("Errore: Il tuo ruolo non è configurato correttamente.", NotificationType.Warning);

                        Set(varPopupNotifiche,false)
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Start: =true
                  Visible: =false
            - Image2:
                Control: Image@2.2.3
                Properties:
