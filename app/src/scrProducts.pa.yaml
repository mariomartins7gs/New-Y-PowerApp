                              Color: |-
                                =If(
                                    Coalesce(Value(varArticoloSel.'Quantità residua'), 0) < 30,
                                    RGBA(220, 53, 69, 1),
                                    Value(varArticoloSel.'Quantità residua') <= 100,
                                    RGBA(255, 170, 0, 1),
                                    RGBA(25, 135, 84, 1)
                                )
                              Font: =Font.'Open Sans'
                              Height: =62
                              Text: |-
                                =If(
                                    Coalesce(Value(varArticoloSel.'Quantità residua'), 0) < 30,
                                    Upper("🔴 Critico"),
                                    Value(varArticoloSel.'Quantità residua') <= 100,
                                    Upper("🟡 In esaurimento"),
                                    Upper("🟢 OK")
                                )
                              X: =220
                              Y: =193
                        - Button3:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =Color.DimGray
                              Font: =Font.'Open Sans'
                              Height: =If(Value(varArticoloSel.'Quantità residua') <= 0, 100, 50)
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
