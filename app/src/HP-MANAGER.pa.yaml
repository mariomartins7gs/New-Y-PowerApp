            Width: =40
            X: =1180
            Y: =26
      - cntOverlayHP:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 60%)
            Height: =Parent.Height
            Visible: =varPopupNotifiche
            Width: =Parent.Width
          Children:
            - rctTornaIndietroHP:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =Color.Transparent
                  Height: =Parent.Height
                  OnSelect: =Set(varPopupNotifiche, false)
                  Visible: =varPopupNotifiche
                  Width: =Parent.Width
            - cntPopUpNotifiche:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =TemaNewY.LuceSuperficie
                  Height: =Parent.Height * 0.85
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  Visible: =varPopupNotifiche
                  Width: =Parent.Width * 0.75
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - lblTitoloNotifiche:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =22
                        Text: |-
                          ="🔔 Notifiche"
                        Width: =Parent.Width/3
                        X: =25
                        Y: =20
                  - Gallery1:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =TemaNewY.ScuroPrimario
                        BorderThickness: =2
                        Height: =Parent.Height - 90
                        Items: =SortByColumns(Filter('Notifiche-BC', Letta = false,Destinatario = "Manager"), "Data", SortOrder.Descending)
                        TemplateFill: =TemaNewY.AccentiDorati
                        TemplateSize: =110
                        Width: =Parent.Width - 40
                        X: '=20 '
                        Y: =70
                      Children:
                        - Button1:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              DisplayMode: =DisplayMode.View
                              Fill: |-
                                =Switch(
                                    ThisItem.TipoNotifica.Value,
                                    "RichiestaValidazione", RGBA(30, 70, 160, 1),
                                    "Risultato", RGBA(20, 110, 60, 1),
                                    "NuovaAssegnazione", RGBA(150, 100, 10, 1),
                                    "Promemoria", RGBA(80, 80, 80, 1),
                                    "RichiestaRiordino", RGBA(160, 80, 20, 1),
                                    "RichiestaEliminazioneCliente", RGBA(160, 30, 30, 1),
                                    RGBA(60, 60, 60, 1)
                                )
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =65
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              RadiusBottomLeft: =15
                              RadiusBottomRight: =15
                              RadiusTopLeft: =15
                              RadiusTopRight: =15
                              Text: |-
                                =Switch(
                                    ThisItem.TipoNotifica.Value,
                                    "RichiestaDistaccoCliente", "↩️ Distacco",
                                    "Risultato", "📋 Risultato",
                                    "NuovaAssegnazioneCliente", "🆕 Nuova assegnazione",
                                    "Promemoria", "⏰ Promemoria",
                                    "RichiestaRiordino", "📦 Riordino",
                                    "RichiestaEliminazioneCliente", "🗑 Eliminazione cliente",
                                    ThisItem.TipoNotifica.Value
                                )
                              Width: =200
                              X: =16
                              Y: =5
                        - lblMessaggio:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Open Sans'
                              Height: =105
                              Size: =12
                              Text: =ThisItem.Messaggio
                              Width: =374
                              X: =296
                        - lblMittenteData:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Lato Black'
                              FontWeight: =FontWeight.Bold
                              Height: =57
                              Size: =12
                              Text: |-
                                ="Da: " & ThisItem.Mittente & " • " & Text(ThisItem.Data, "gg/mm/aaaa")
                              Width: =280
                              X: =16
                              Y: =52
                        - btnApprove:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =TemaNewY.Successo
                              Font: =Font.'Open Sans'
                              Height: =35
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(Self.Fill, 45%)
                              OnSelect: |-
                                =If(
                                    ThisItem.TipoNotifica.Value = "RichiestaDistaccoCliente",
                                    Patch(
                                        'Clienti-BC',
                                        LookUp('Clienti-BC', ID = Value(ThisItem.LinkRif)),
                                        { 'Cod agente': Blank() }
                                    );
                                    Patch('Notifiche-BC', ThisItem, { Letta: true, 'Approvata\Rifiutata': { Value: "Approvata" } });
                                    Notify("Cliente staccato dall'agente", NotificationType.Success),

                                    ThisItem.TipoNotifica.Value = "RichiestaEliminazioneCliente",
                                    Patch(
                                        'Clienti-BC',
                                        LookUp('Clienti-BC', ID = Value(ThisItem.LinkRif)),
                                        { Attivo: false }
                                    );
                                    Patch('Notifiche-BC', ThisItem, { Letta: true, 'Approvata\Rifiutata': { Value: "Approvata" } });
                                    Notify("Cliente disattivato", NotificationType.Success),

                                    ThisItem.TipoNotifica.Value = "RichiestaRiordino",
                                    With(
                                        { riordinoSel: LookUp('Riordini-BC', ID = Value(ThisItem.LinkRif)) },
                                        With(
                                            { articoloSel: LookUp('Articoli-BC', Nr = riordinoSel.CodArticolo) },
                                            With(
                                                { nuovaQta: Value(articoloSel.'Quantità residua') + Value(riordinoSel.QtaRichiesta) },
                                                Patch('Articoli-BC', articoloSel, { 'Quantità residua': nuovaQta });
                                                Patch('Riordini-BC', riordinoSel, { Stato: { Value: "Approvato" } });
                                                Patch('Notifiche-BC', ThisItem, { Letta: true, 'Approvata\Rifiutata': { Value: "Approvata" } });
                                                Notify("Riordino approvato ✔ Nuova quantità: " & nuovaQta, NotificationType.Success)
                                            )
                                        )
                                    ),

                                    // altri tipi (fallback)
                                    Patch('Notifiche-BC', ThisItem, { Letta: true });
                                    Notify("Notifica letta", NotificationType.Success)
                                )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Text: ="✔"
                              Visible: =ThisItem.TipoNotifica.Value in ["RichiestaDistaccoCliente", "RichiestaEliminazioneCliente", "RichiestaRiordino"]
                              Width: =70
                              X: =726
                              Y: =35
                        - btnDny:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =Color.DarkRed
                              Font: =Font.'Open Sans'
                              Height: =35
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(Self.Fill, 45%)
                              OnSelect: |-
                                =If(
                                    ThisItem.TipoNotifica.Value = "RichiestaRiordino",
                                    Patch(
                                        'Riordini-BC',
                                        LookUp('Riordini-BC', ID = Value(ThisItem.LinkRif)),
                                        { Stato: { Value: "Rifiutato" } }
                                    );
                                    true
                                );
                                Patch(
                                    'Notifiche-BC',
                                    ThisItem,
                                    {
                                        Letta: true,
                                        'Approvata\Rifiutata': { Value: "Rifiutata" }
                                    }
                                );
                                Notify("Richiesta rifiutata", NotificationType.Success)
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Text: ="✘"
                              Visible: =ThisItem.TipoNotifica.Value in ["RichiestaDistaccoCliente", "RichiestaEliminazioneCliente", "RichiestaRiordino"]
                              Width: =70
                              X: =809
                              Y: =35
